x-ci-base: &ci-base
  build:
    context: .
    dockerfile: Dockerfile.ci
  read_only: true
  tmpfs:
    - /tmp:exec,mode=1777

x-ci-env: &ci-env
  COMPOSER_HOME: /home/ci/.composer
  CI_WORK_BASE: /tmp

x-ci-repo-volume: &ci-repo-volume ".:/repo:ro"

services:
  ci-dev:
    <<: *ci-base
    volumes:
      - *ci-repo-volume
      - "composer_home_dev:/home/ci/.composer"
      - "npm_cache_dev:/home/ci/.npm"
    environment:
      <<: *ci-env
      PIPELINE: dev
    command: bash /repo/bin/ci

  ci-preview:
    <<: *ci-base
    volumes:
      - *ci-repo-volume
      - "composer_home_preview:/home/ci/.composer"
      - "npm_cache_preview:/home/ci/.npm"
    environment:
      <<: *ci-env
      PIPELINE: preview
      DEBUG: "${DEBUG:-0}"
    command:
      - bash
      - -c
      - |
        exec bash /repo/bin/ci "$${CI_TEST_CASE:?CI_TEST_CASE fehlt}" <<'YAML'
        smtp:
          SMTP_HOST: "mailpit"
          SMTP_PORT: "1025"
          SMTP_USER: "ci"
          SMTP_PASS: "ci-pass"
          SMTP_FROM_EMAIL: "noreply@ci.invalid"
        mail:
          MAIL_TO_EMAIL: "ci-test@ci.invalid"
        sftp:
          SFTP_HOST: "sftp-server"
          SFTP_USER: "preview-ci"
          SFTP_PASS: "ci-pass"
          SFTP_SERVER_DIR: "/public"
          SSH_KNOWN_HOST_LINE: "sftp-server ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINl08bdUU+IRN4P6BQJAWbOPPjy3nCxMdwx+eDtIzivk"
        YAML
      - --
    depends_on:
      - sftp-server
      - preview-web
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_FILE: "/smtp-auth"
      MP_SMTP_TLS_CERT: "/tls/mailpit.crt"
      MP_SMTP_TLS_KEY: "/tls/mailpit.key"
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - "./tests/ci/smtp-auth:/smtp-auth:ro"
      - "./tests/ci/mailpit.crt:/tls/mailpit.crt:ro"
      - "./tests/ci/mailpit.key:/tls/mailpit.key:ro"

  sftp-server:
    image: atmoz/sftp:alpine
    command: "preview-ci:ci-pass:1000::public"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    volumes:
      - "preview_deploy:/home/preview-ci/public"
      - "./tests/ci/sftp_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro"
      - "./tests/ci/sftp_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro"

  preview-web:
    image: php:8.2-apache
    environment:
      APACHE_RUN_USER: "preview-ci"
      APACHE_RUN_GROUP: "preview-ci"
    command: bash /scripts/config-apache.sh
    volumes:
      - "preview_deploy:/var/www/html"
      - "./scripts/config-apache.sh:/scripts/config-apache.sh:ro"

volumes:
  composer_home_dev:
  npm_cache_dev:
  composer_home_preview:
  npm_cache_preview:
  preview_deploy:
    name: preview_deploy
