x-ci-base: &ci-base
  build:
    context: .
    dockerfile: Dockerfile.ci
  read_only: true
  tmpfs:
    - /tmp:exec,mode=1777

x-ci-env: &ci-env
  COMPOSER_HOME: /home/ci/.composer
  CI_WORK_BASE: /tmp

x-ci-repo-volume: &ci-repo-volume ".:/repo:ro"
x-local-repo-volume: &local-repo-volume ".:/repo"

x-ci-pipeline-env: &ci-pipeline-env
  <<: *ci-env
  PIPELINE: preview
  DEBUG: "$DEBUG"
  PIPELINE_RUN_ID: "$PIPELINE_RUN_ID"
  SFTP_DEPLOY_OVERRIDES: "${SFTP_DEPLOY_OVERRIDES:-}"
  LOG_FORMAT: "${LOG_FORMAT:-}"
  CI_CV_DATA_PATH: "${CI_CV_DATA_PATH:-}"
  CI_CV_DATA_PREPARE_SCRIPT: "${CI_CV_DATA_PREPARE_SCRIPT:-}"

x-ci-runner: &ci-runner
  <<: *ci-base
  environment:
    <<: *ci-pipeline-env

services:
  dev-smoke:
    <<: *ci-base
    volumes:
      - *ci-repo-volume
      - "composer_home_dev:/home/ci/.composer"
      - "npm_cache_dev:/home/ci/.npm"
    environment:
      <<: *ci-env
      PIPELINE: dev
    command: bash /repo/bin/ci

  ci-driver:
    <<: *ci-runner
    volumes:
      - *ci-repo-volume
      - "composer_home_ci:/home/ci/.composer"
      - "npm_cache_ci:/home/ci/.npm"
    environment:
      <<: *ci-pipeline-env
      PIPELINE: "$PIPELINE"
    command:
      - bash
      - -c
      - |
        {
        cat <<'YAML'
        app:
          APP_ROOT_URL: "http://ci-web"
        mail:
          MAIL_TO_EMAIL: "ci-test@ci.invalid"
        YAML
        if [[ -n "$${CI_CV_DATA_PATH:-}" ]]; then
          printf 'lebenslauf:\n  LEBENSLAUF_DATEN_PFAD: "%s"\n' "$$CI_CV_DATA_PATH"
        fi
        cat <<'YAML'
        sftp:
          SFTP_HOST: "sftp-server"
          SFTP_USER: "preview-ci"
          SFTP_PASS: "ci-pass"
          SFTP_SERVER_DIR: "/deploy"
          SSH_KNOWN_HOST_LINE: "sftp-server ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINl08bdUU+IRN4P6BQJAWbOPPjy3nCxMdwx+eDtIzivk"
        smtp:
          SMTP_HOST: "mailpit"
          SMTP_PORT: "1025"
          SMTP_USER: "ci"
          SMTP_PASS: "ci-pass"
          SMTP_FROM_EMAIL: "noreply@ci.invalid"
        YAML
        } | exec bash /repo/${CI_CV_DATA_PREPARE_SCRIPT:-bin/ci} "$${CI_TEST_CASE:-}"
      - --
    depends_on:
      sftp-server:
        condition: service_healthy
      ci-web:
        condition: service_started
      mailpit:
        condition: service_started

  deploy-local:
    <<: *ci-runner
    volumes:
      - *local-repo-volume
      - "composer_home_ci:/home/ci/.composer"
      - "npm_cache_ci:/home/ci/.npm"
    environment:
      <<: *ci-pipeline-env
      LAST_DEPLOY_COMMIT: "$LAST_DEPLOY_COMMIT"
    command: bash /repo/bin/cd

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_FILE: "/smtp-auth"
      MP_SMTP_TLS_CERT: "/tls/mailpit.crt"
      MP_SMTP_TLS_KEY: "/tls/mailpit.key"
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - "./tests/ci/smtp-auth:/smtp-auth:ro"
      - "./tests/ci/mailpit.crt:/tls/mailpit.crt:ro"
      - "./tests/ci/mailpit.key:/tls/mailpit.key:ro"

  sftp-server:
    image: atmoz/sftp:alpine
    entrypoint: sh
    environment:
      CI_SFTP_DIR: "${CI_SFTP_DIR:-deploy}"
    command:
      - -c
      - |
        cp /tmp/ssh_host_ed25519_key /etc/ssh/ssh_host_ed25519_key &&
        chmod 600 /etc/ssh/ssh_host_ed25519_key &&
        exec /entrypoint preview-ci:ci-pass:1000::$${CI_SFTP_DIR}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    volumes:
      - "ci_deploy:/home/preview-ci/${CI_SFTP_DIR:-deploy}"
      - "./tests/ci/sftp_host_ed25519_key:/tmp/ssh_host_ed25519_key:ro"
      - "./tests/ci/sftp_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro"

  ci-web:
    image: php:8.2-apache
    environment:
      APACHE_RUN_USER: "preview-ci"
      APACHE_RUN_GROUP: "preview-ci"
    command: bash /scripts/config-apache.sh
    volumes:
      - "ci_deploy:/var/www/html"
      - "./scripts/config-apache.sh:/scripts/config-apache.sh:ro"
      - "./tests/ci/ca.crt:/usr/local/share/ca-certificates/ci-mailpit-ca.crt:ro"

volumes:
  composer_home_dev:
  npm_cache_dev:
  composer_home_ci:
  npm_cache_ci:
  ci_deploy:
    name: ci_deploy
