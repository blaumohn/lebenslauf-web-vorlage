name: Preview Deploy

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run preview pipeline
        id: resolve_deploy
        shell: bash
        run: bin/ci pipeline-check ${{ vars.PIPELINE }} --dir var/deploy --github-output "$GITHUB_OUTPUT"
        env:
          SMTP_PASS: 123
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ vars.FTP_PORT }}

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.resolve_deploy.outputs.ftp_host }}
          username: ${{ steps.resolve_deploy.outputs.ftp_user }}
          password: ${{ steps.resolve_deploy.outputs.ftp_pass }}
          port: ${{ steps.resolve_deploy.outputs.ftp_port }}
          local-dir: var/deploy/
          server-dir: ${{ steps.resolve_deploy.outputs.ftp_server_dir }}
