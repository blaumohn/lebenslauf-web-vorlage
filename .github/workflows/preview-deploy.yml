name: Preview Deploy

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare config inputs
        run: bin/ci prepare-config ${{ vars.PIPELINE }}
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ vars.FTP_PORT }}

      - name: Config check
        run: bin/ci config-check ${{ vars.PIPELINE }}

      - name: Setup
        run: php bin/cli setup ${{ vars.PIPELINE }}

      - name: Build
        run: php bin/cli build ${{ vars.PIPELINE }}

      - name: Deploy check
        run: bin/ci deploy-check ${{ vars.PIPELINE }}

      - name: Resolve deploy outputs
        id: resolve_deploy
        shell: bash
        run: |
          set -euo pipefail
          pipeline="${{ vars.PIPELINE }}"

          printf 'ftp_host=%s\n' "$(php bin/cli config get "$pipeline" FTP_HOST --phase deploy)" >> "$GITHUB_OUTPUT"
          printf 'ftp_user=%s\n' "$(php bin/cli config get "$pipeline" FTP_USER --phase deploy)" >> "$GITHUB_OUTPUT"
          printf 'ftp_pass=%s\n' "$(php bin/cli config get "$pipeline" FTP_PASS --phase deploy)" >> "$GITHUB_OUTPUT"
          printf 'ftp_port=%s\n' "$(php bin/cli config get "$pipeline" FTP_PORT --phase deploy)" >> "$GITHUB_OUTPUT"
          printf 'ftp_server_dir=%s\n' "$(php bin/cli config get "$pipeline" FTP_SERVER_DIR --phase deploy)" >> "$GITHUB_OUTPUT"

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.resolve_deploy.outputs.ftp_host }}
          username: ${{ steps.resolve_deploy.outputs.ftp_user }}
          password: ${{ steps.resolve_deploy.outputs.ftp_pass }}
          port: ${{ steps.resolve_deploy.outputs.ftp_port }}
          local-dir: deploy/
          server-dir: ${{ steps.resolve_deploy.outputs.ftp_server_dir }}
