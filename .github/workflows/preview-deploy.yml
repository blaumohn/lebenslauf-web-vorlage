name: Preview Deploy

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run preview pipeline
        id: resolve_deploy
        shell: bash
        env:
          APP_PIPELINE: ${{ vars.APP_PIPELINE }}
          DEPLOY_DIR: var/deploy
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          SSH_KNOWN_HOST_LINE: ${{ secrets.SSH_KNOWN_HOST_LINE }}
        run: bin/cd

      - name: Install sshpass
        run: sudo apt-get install -y sshpass openssh-client

      - name: Deploy via SFTP
        env:
          SSHPASS: ${{ steps.resolve_deploy.outputs.ftp_pass }}
          SFTP_HOST: ${{ steps.resolve_deploy.outputs.ftp_host }}
          SFTP_USER: ${{ steps.resolve_deploy.outputs.ftp_user }}
          SFTP_PORT: ${{ steps.resolve_deploy.outputs.ftp_port }}
          SFTP_REMOTE_DIR: ${{ steps.resolve_deploy.outputs.ftp_server_dir }}
          SSH_KNOWN_HOST_LINE: ${{ steps.resolve_deploy.outputs.ssh_known_host_line}}
        run: sh scripts/sftp-deploy.sh