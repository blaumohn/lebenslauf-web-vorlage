name: Preview Deploy

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run preview pipeline and deploy
        shell: bash
        env:
          PIPELINE: ${{ vars.PIPELINE }}
          LAST_DEPLOY_COMMIT: ${{ github.event.before }}
        run: |
          bin/cd << EOF
          smtp:
            SMTP_HOST: "${{ secrets.SMTP_HOST }}"
            SMTP_USER: "${{ secrets.SMTP_USER }}"
            SMTP_PASS: "${{ secrets.SMTP_PASS }}"
            SMTP_FROM_EMAIL: "${{ secrets.SMTP_FROM_EMAIL }}"
          mail:
            MAIL_TO_EMAIL: "${{ secrets.MAIL_TO_EMAIL }}"
          sftp:
            SFTP_HOST: "${{ secrets.SFTP_HOST }}"
            SFTP_USER: "${{ secrets.SFTP_USER }}"
            SFTP_PASS: "${{ secrets.SFTP_PASS }}"
            SSH_KNOWN_HOST_LINE: "${{ secrets.SSH_KNOWN_HOST_LINE }}"
          EOF
