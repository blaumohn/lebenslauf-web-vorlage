name: Preview-CD gemeinsam

on:
  workflow_call:
    inputs:
      last-deploy-commit:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Preview-Pipeline ausführen und deployen
        shell: bash
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LAST_DEPLOY_COMMIT: ${{ inputs.last-deploy-commit }}
          PIPELINE: ${{ vars.PIPELINE }}
        run: |
          bin/cd << EOF
          app:
            APP_ROOT_URL: "${{ vars.APP_ROOT_URL }}"
          smtp:
            SMTP_HOST: "${{ secrets.SMTP_HOST }}"
            SMTP_USER: "${{ secrets.SMTP_USER }}"
            SMTP_PASS: "${{ secrets.SMTP_PASS }}"
            SMTP_FROM_EMAIL: "${{ secrets.SMTP_FROM_EMAIL }}"
          mail:
            MAIL_TO_EMAIL: "${{ secrets.MAIL_TO_EMAIL }}"
          sftp:
            SFTP_HOST: "${{ secrets.SFTP_HOST }}"
            SFTP_USER: "${{ secrets.SFTP_USER }}"
            SFTP_PASS: "${{ secrets.SFTP_PASS }}"
            SSH_KNOWN_HOST_LINE: "${{ secrets.SSH_KNOWN_HOST_LINE }}"
          EOF
