variables:
  context:
    PIPELINE: {}
    PHASE: {}
    PROFILE: {}

  app:
    APP_ENV: {}
    APP_BASE_PATH: {}
    APP_URL: {}
    TRUST_PROXY: {}

  lebenslauf:
    LEBENSLAUF_DATEN_PFAD: {}
    LEBENSLAUF_YAML_PFAD: {}
    LEBENSLAUF_JSON_PFAD: {}

  content:
    CONTENT_INI_PATH: {}

  captcha:
    CAPTCHA_TTL_SECONDS: {}
    CAPTCHA_MAX_GET: {}

  contact:
    CONTACT_MAX_POST: {}

  rate_limit:
    RATE_LIMIT_WINDOW_SECONDS: {}

  mail:
    MAIL_STDOUT: {}
    SMTP_HOST: {}
    SMTP_PORT: {}
    SMTP_USER: {}
    SMTP_PASS:
      sources: [system, local]
    SMTP_ENCRYPTION: {}
    SMTP_FROM_EMAIL: {}
    SMTP_FROM_NAME: {}

  security:
    IP_SALT:
      sources: [system, local]

  deploy:
    FTP_SERVER_DIR: {}
    FTP_PORT: {}
    FTP_HOST:
      sources: [system, local]
    FTP_USER:
      sources: [system, local]
    FTP_PASS:
      sources: [system, local]

  tooling:
    PY_PREFER_VENV: {}
    PY_ALLOW_SYSTEM: {}
    PY_PROMPT_ON_MISSING_VENV: {}

  tests:
    CLONE_SOURCE: {}
    KEEP_SMOKE_CLONE: {}

pipelines:
  common:
    setup:
      required: [PIPELINE, PHASE]
      allowed: [context, app, lebenslauf, tooling, tests]
    build:
      required: [PIPELINE, PHASE, APP_ENV]
      allowed: [context, app, lebenslauf, content, captcha, contact, rate_limit, mail, security, tooling, tests]
    runtime:
      required: [PIPELINE, PHASE, APP_ENV]
      allowed: [context, app, content, captcha, contact, rate_limit, mail, security]
    deploy:
      required: [PIPELINE, PHASE]
      allowed: [context, deploy]

  dev:
    setup:
      required: [APP_ENV]
      allowed: []
    build:
      required: []
      allowed: []
    runtime:
      required:
        - APP_ENV
        - IP_SALT
        - CAPTCHA_MAX_GET
        - CONTACT_MAX_POST
        - RATE_LIMIT_WINDOW_SECONDS
        - MAIL_STDOUT
        - SMTP_FROM_NAME
      allowed: []

  smoketest:
    runtime:
      required: [PROFILE, APP_ENV, IP_SALT]
      allowed: [lebenslauf]

  delivery:
    build:
      required: [PROFILE, APP_ENV]
      allowed: []
    runtime:
      required: [PROFILE, APP_ENV, IP_SALT]
      allowed: []
    deploy:
      required: [PROFILE, FTP_SERVER_DIR]
      allowed: [APP_ENV]
