app:
  APP_BASE_PATH: "/"
  TRUST_PROXY: 0
  APP_LOG_CHANNEL: stderr

lebenslauf:
  LEBENSLAUF_DATEN_PFAD: .local/lebenslauf
  LEBENSLAUF_YAML_PFAD: .local/lebenslauf
  LEBENSLAUF_PUBLIC_PROFILE: default
  LEBENSLAUF_LANG_DEFAULT: de
  LEBENSLAUF_LANGS: "de,en"

captcha:
  CAPTCHA_TTL_SECONDS: 600
  CAPTCHA_MAX_GET: 5

contact:
  CONTACT_MAX_POST: 3

mail:
  MAIL_TO_EMAIL: kontakt@beispiel.de
  MAIL_STDOUT: 1

rate_limit:
  RATE_LIMIT_WINDOW_SECONDS: 600

smtp:
  SMTP_FROM_NAME: Lebenslauf

