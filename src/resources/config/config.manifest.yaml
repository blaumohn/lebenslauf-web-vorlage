variables:
  pipeline_phase:
    PIPELINE: {}
    PHASE: {}

  app:
    APP_BASE_PATH:
      meta:
        desc: "URL-Basis-Pfad der Anwendung (Routing)"
        notes: >-
          Nicht mit Dateisystem-Pfad verwechseln. Beispiel: /public bei
          https://domain.tld/public
        example: "/public"
    APP_URL:
      meta:
        desc: "Basis-URL der Anwendung"
        example: "https://example.invalid"
    TRUST_PROXY: {}

  lebenslauf:
    LEBENSLAUF_DATEN_PFAD: {}
    LEBENSLAUF_YAML_PFAD: {}
    LEBENSLAUF_JSON_PFAD: {}
    LEBENSLAUF_PUBLIC_PROFILE: {}
    LEBENSLAUF_LANG_DEFAULT: {}
    LEBENSLAUF_LANGS: {}

  captcha:
    CAPTCHA_TTL_SECONDS: {}
    CAPTCHA_MAX_GET: {}

  contact:
    CONTACT_MAX_POST: {}
    CONTACT_TO_EMAIL:
      meta:
        desc: "Empfängeradresse für Kontaktformular"
        example: "kontakt@example.invalid"
    CONTACT_FROM_EMAIL:
      meta:
        desc: "Absenderadresse für Kontaktformular"
        example: "web@example.invalid"

  rate_limit:
    RATE_LIMIT_WINDOW_SECONDS: {}

  mail:
    MAIL_STDOUT: {}
    SMTP_HOST:
      meta:
        desc: "SMTP-Host"
        example: "smtp.example.invalid"
    SMTP_PORT: {}
    SMTP_USER:
      meta:
        desc: "SMTP-Benutzername"
        example: "user"
    SMTP_PASS:
      sources: [system, local]
    SMTP_ENCRYPTION: {}
    SMTP_FROM_EMAIL:
      meta:
        desc: "Absenderadresse für SMTP"
        example: "kontakt@example.invalid"
    SMTP_FROM_NAME:
      meta:
        desc: "Absendername für SMTP"
        example: "Beispiel"

  security:
    IP_SALT:
      sources: [system, local, file]
      meta:
        desc: "Salt für IP-Hashing"
        example: "change-me"

  deploy:
    FTP_SERVER_DIR: {}
    FTP_PORT: {}
    FTP_HOST:
      sources: [system, local]
    FTP_USER:
      sources: [system, local]
    FTP_PASS:
      sources: [system, local]

  tooling:
    PYTHON_CMD: {}
    PYTHON_PATHS: {}

  tests:
    CLONE_SOURCE: {}
    KEEP_SMOKE_CLONE: {}

pipelines:
  common:
    setup:
      lebenslauf:
        - LEBENSLAUF_PUBLIC_PROFILE
      tooling: "*"
      tests: "*"
    python:
      tooling: "*"
    build:
      app:
        - APP_BASE_PATH
        - APP_URL
      lebenslauf: "*"
      captcha: "*"
      contact: "*"
      rate_limit: "*"
      mail: "*"
      security:
        - IP_SALT
      tooling: "*"
      tests: "*"
    runtime:
      app:
        - APP_BASE_PATH
        - TRUST_PROXY
      lebenslauf:
        - LEBENSLAUF_LANG_DEFAULT
        - LEBENSLAUF_LANGS
      captcha: "*"
      contact: "*"
      rate_limit: "*"
      mail: "*"
      security:
        - IP_SALT
    deploy:
      deploy: "*"

  dev:
    setup: {}
    runtime: {}

  preview:
    deploy:
      deploy: "*"
