variable-groups:
  - key: app
    variables:
      - key: APP_BASE_PATH
        meta:
          desc: "URL-Basis-Pfad der Anwendung (Routing)"
          notes: >-
            Nicht mit Dateisystem-Pfad verwechseln. Beispiel: /public bei
            https://domain.tld/public
          example: "/public"
      - key: APP_URL
        meta:
          desc: "Basis-URL der Anwendung"
          example: "https://example.invalid"
      - key: TRUST_PROXY
        meta:
          desc: "Anzahl vertrauenswürdiger Proxy-Ebenen (0 = kein Proxy)"
          example: "1"

  - key: lebenslauf
    variables:
      - key: LEBENSLAUF_DATEN_PFAD
        meta:
          desc: "Pfad zum Lebenslauf-Datenverzeichnis"
          example: ".local/lebenslauf"
      - key: LEBENSLAUF_YAML_PFAD
        meta:
          desc: "Pfad zur Lebenslauf-YAML-Quelldatei (leer = Standard im Datenpfad)"
          notes: >-
            Leer bedeutet: nutze den Datenpfad als Verzeichnis und lese dort
            alle daten-<profil>.yaml-Dateien.
          example: ""
      - key: LEBENSLAUF_PUBLIC_PROFILE
        meta:
          desc: "Profilname für den öffentlichen Lebenslauf"
          notes: >-
            Nur im Build relevant. Das Profil muss zu einer vorhandenen
            daten-<profil>.yaml-Datei im YAML-Pfad passen.
          example: "default"
      - key: LEBENSLAUF_LANG_DEFAULT
        meta:
          desc: "Standard-Sprache des Lebenslaufs"
          notes: >-
            Muss in LEBENSLAUF_LANGS enthalten sein.
          example: "de"
      - key: LEBENSLAUF_LANGS
        meta:
          desc: "Kommagetrennte Liste unterstützter Sprachen"
          notes: >-
            Muss die Standard-Sprache enthalten und zum vorhandenen
            Übersetzungsstand der Labels passen.
          example: "de,en"

  - key: captcha
    variables:
      - key: CAPTCHA_TTL_SECONDS
        meta:
          desc: "Gültigkeitsdauer eines Captcha-Tokens in Sekunden"
          notes: >-
            Gilt sowohl für die HTTP-Runtime als auch für das CLI-Cleanup, das
            noch gültige Captchas nicht vorzeitig entfernen soll.
          example: "600"
      - key: CAPTCHA_MAX_GET
        meta:
          desc: "Maximale Captcha-Anfragen pro Zeitfenster"
          example: "5"

  - key: contact
    variables:
      - key: CONTACT_MAX_POST
        meta:
          desc: "Maximale Kontaktformular-Absendungen pro Zeitfenster"
          example: "3"
      - key: CONTACT_TO_EMAIL
        meta:
          desc: "Empfängeradresse für Kontaktformular"
          notes: >-
            Bleibt unabhängig vom SMTP-Absenderpfad. Der Wert bestimmt das
            Ziel des Formulars, nicht den Absender der App.
          example: "kontakt@example.invalid"

  - key: rate_limit
    variables:
      - key: RATE_LIMIT_WINDOW_SECONDS
        meta:
          desc: "Länge des Rate-Limit-Zeitfensters in Sekunden"
          example: "600"

  - key: mail
    variables:
      - key: MAIL_STDOUT
        meta:
          desc: "E-Mail-Ausgabe auf stdout statt SMTP (1 = aktiv, für Entwicklung)"
          notes: >-
            Standardfall in dev und preview. Wenn echter SMTP-Versand gewünscht
            ist, MAIL_STDOUT deaktivieren und die benötigten SMTP_*-Werte
            passend setzen.
          example: "1"
      - key: SMTP_HOST
        meta:
          desc: "SMTP-Host"
          notes: >-
            Nur relevant bei echtem SMTP-Betrieb zusammen mit SMTP_PORT,
            SMTP_USER, SMTP_PASS, SMTP_ENCRYPTION, SMTP_FROM_EMAIL und
            SMTP_FROM_NAME.
          example: "smtp.example.invalid"
      - key: SMTP_PORT
        meta:
          desc: "SMTP-Port"
          notes: >-
            Nur relevant bei echtem SMTP-Betrieb zusammen mit SMTP_HOST.
          example: "587"
      - key: SMTP_USER
        meta:
          desc: "SMTP-Benutzername"
          notes: >-
            Nur relevant bei echtem SMTP-Betrieb zusammen mit SMTP_HOST und
            SMTP_PASS.
          example: "user"
      - key: SMTP_PASS
        sources: [system, local]
        meta:
          notes: >-
            Nur relevant bei echtem SMTP-Betrieb zusammen mit SMTP_HOST und
            SMTP_USER. Gehört nicht in versionierte Beispielkonfigurationen.
      - key: SMTP_ENCRYPTION
        meta:
          desc: "SMTP-Verschlüsselung (tls, ssl oder leer)"
          notes: >-
            Nur relevant bei echtem SMTP-Betrieb zusammen mit SMTP_HOST und
            SMTP_PORT.
          example: "tls"
      - key: SMTP_FROM_EMAIL
        meta:
          desc: "Absenderadresse der App für ausgehende E-Mails"
          notes: >-
            Nur relevant bei echtem SMTP-Betrieb zusammen mit
            SMTP_FROM_NAME. Nicht mit CONTACT_TO_EMAIL verwechseln.
          example: "kontakt@example.invalid"
      - key: SMTP_FROM_NAME
        meta:
          desc: "Absendername der App für ausgehende E-Mails"
          notes: >-
            Nur relevant bei echtem SMTP-Betrieb zusammen mit
            SMTP_FROM_EMAIL.
          example: "Lebenslauf"

  - key: deploy
    variables:
      - key: FTP_SERVER_DIR
        meta:
          desc: "Zielverzeichnis auf dem FTP-Server"
          example: "/home/user/public"
      - key: FTP_PORT
        meta:
          desc: "FTP-Port"
          example: "21"
      - key: FTP_HOST
        sources: [system, local]
      - key: FTP_USER
        sources: [system, local]
      - key: FTP_PASS
        sources: [system, local]

  - key: tooling
    variables:
      - key: PYTHON_CMD
        meta:
          desc: "Python-Befehl oder Pfad zur Python-Executable"
          example: ".venv/bin/python"
      - key: PYTHON_PATHS
        meta:
          desc: "Kommagetrennte zusätzliche Python-Suchpfade"
          example: "src"

  - key: tests
    variables:
      - key: CLONE_SOURCE
        meta:
          desc: "Quelle für Smoke-Test-Clone (local oder remote)"
          example: "local"
      - key: KEEP_SMOKE_CLONE
        meta:
          desc: "Smoke-Clone nach Test behalten (1 = ja, für Debugging)"
          example: "0"

pipelines:
  common:
    python:
      - group-key: tooling
        select: "*"
    build:
      - group-key: app
        variables:
          - key: APP_BASE_PATH
          - key: APP_URL
      - group-key: lebenslauf
        select: "*"
    runtime:
      - group-key: app
        variables:
          - key: APP_BASE_PATH
          - key: TRUST_PROXY
      - group-key: lebenslauf
        variables:
          - key: LEBENSLAUF_LANG_DEFAULT
          - key: LEBENSLAUF_LANGS
      - group-key: captcha
        select: "*"
      - group-key: contact
        select: "*"
      - group-key: rate_limit
        select: "*"
      - group-key: mail
        select: "*"

  preview:
    deploy:
      - group-key: deploy
        select: "*"
