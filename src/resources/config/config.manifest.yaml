variables:
  pipeline_phase:
    PIPELINE: {}
    PHASE: {}

  app:
    APP_BASE_PATH: {}
    APP_URL: {}
    TRUST_PROXY: {}

  lebenslauf:
    LEBENSLAUF_DATEN_PFAD: {}
    LEBENSLAUF_YAML_PFAD: {}
    LEBENSLAUF_JSON_PFAD: {}
    LEBENSLAUF_PUBLIC_PROFILE: {}
    LEBENSLAUF_LANG_DEFAULT: {}
    LEBENSLAUF_LANGS: {}

  captcha:
    CAPTCHA_TTL_SECONDS: {}
    CAPTCHA_MAX_GET: {}

  contact:
    CONTACT_MAX_POST: {}
    CONTACT_TO_EMAIL: {}
    CONTACT_FROM_EMAIL: {}

  rate_limit:
    RATE_LIMIT_WINDOW_SECONDS: {}

  mail:
    MAIL_STDOUT: {}
    SMTP_HOST: {}
    SMTP_PORT: {}
    SMTP_USER: {}
    SMTP_PASS:
      sources: [system, local]
    SMTP_ENCRYPTION: {}
    SMTP_FROM_EMAIL: {}
    SMTP_FROM_NAME: {}

  security:
    IP_SALT:
      sources: [system, local, file]

  deploy:
    FTP_SERVER_DIR: {}
    FTP_PORT: {}
    FTP_HOST:
      sources: [system, local]
    FTP_USER:
      sources: [system, local]
    FTP_PASS:
      sources: [system, local]

  tooling:
    PYTHON_CMD: {}
    PYTHON_PATHS: {}

  tests:
    CLONE_SOURCE: {}
    KEEP_SMOKE_CLONE: {}

pipelines:
  common:
    setup:
      lebenslauf:
        - LEBENSLAUF_PUBLIC_PROFILE
      tooling: "*"
      tests: "*"
    python:
      tooling: "*"
    build:
      app:
        - APP_BASE_PATH
        - APP_URL
      lebenslauf: "*"
      captcha: "*"
      contact: "*"
      rate_limit: "*"
      mail: "*"
      security:
        - IP_SALT
      tooling: "*"
      tests: "*"
    runtime:
      app:
        - APP_BASE_PATH
        - TRUST_PROXY
      lebenslauf:
        - LEBENSLAUF_LANG_DEFAULT
        - LEBENSLAUF_LANGS
      captcha: "*"
      contact: "*"
      rate_limit: "*"
      mail: "*"
      security:
        - IP_SALT
    deploy:
      deploy: "*"

  dev:
    setup: {}
    runtime: {}

  preview:
    deploy:
      deploy: "*"
