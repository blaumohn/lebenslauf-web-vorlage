slug: zwei-baum-deploy
datum: "2026-06-19"
status: published

titel:
  de: "Zero-Downtime-Deploy mit zwei Verzeichnisbäumen"
  es: "Deploy sin tiempo de inactividad con dos árboles de directorios"

zusammenfassung:
  de: >
    Ein atomares rename(2) sorgt dafür, dass kein Request einen inkonsistenten
    Zustand sieht — weder beim App-Wechsel noch beim Vendor-Tausch.
  es: >
    Un rename(2) atómico garantiza que ninguna solicitud vea un estado
    inconsistente, ni durante el cambio de app ni durante el de vendor.

inhalt:
  de: |
    <p>Das Deployment nutzt zwei unabhängige Verzeichnisbäume (a/b). Der aktive
    Baum wird per symbolischem Link eingebunden. Der Wechsel erfolgt durch ein
    einzelnes <code>rename(2)</code>, das atomar ist: entweder der alte oder der
    neue Stand ist aktiv, nie ein Mischzustand.</p>
    <p>Vendor-Abhängigkeiten werden separat getauscht, bevor der App-Baum
    umgeschaltet wird. Damit ist auch bei einem Doppelausfall kein inkonsistenter
    Zustand möglich.</p>
  es: |
    <p>El despliegue usa dos árboles de directorios independientes (a/b). El árbol
    activo se enlaza simbólicamente. El cambio se realiza con un único
    <code>rename(2)</code>, que es atómico: siempre está activo el estado antiguo
    o el nuevo, nunca un estado mixto.</p>
    <p>Las dependencias de vendor se intercambian por separado antes de cambiar el
    árbol de la app, lo que impide cualquier estado inconsistente incluso ante un
    fallo doble.</p>

tags:
  - reliability
  - deploy
  - php
