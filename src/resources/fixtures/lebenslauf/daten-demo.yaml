opensource:
- titel: react-visualizer
  projekt: react-visualizer
  url: https://example.invalid/react-visualizer
  zeitraum: '2022'
  punkte:
  - tags:
    - Open Source
    - React
    - Komponentenbaum
    text:
      de: Ein Tool zur Visualisierung von React-Komponenten-Hierarchien mit Fokus auf nachvollziehbare Zustände, Filter und exportierbare Ansichten.
      pt: Uma ferramenta para visualizar hierarquias de componentes React, com foco em estados compreensíveis, filtros e vistas exportáveis.
      es: Una herramienta para visualizar jerarquías de componentes React, con foco en estados comprensibles, filtros y vistas exportables.
  - tags:
    - Open Source
    - Testing
    - Dokumentation
    text:
      de: Implementierung von Unit-Tests zur Sicherstellung der Funktionalität und Robustheit der Anwendung sowie Ergänzung kurzer Nutzungshinweise für neue Beitragende.
      pt: Implementei testes unitários para assegurar a funcionalidade e a robustez da aplicação e acrescentei instruções breves para novos colaboradores.
      es: Implementé pruebas unitarias para asegurar la funcionalidad y la solidez de la aplicación, y añadí breves instrucciones para nuevas personas colaboradoras.
  - tags:
    - Issues
    - Review
    - Release-Vorbereitung
    text:
      de: Eingehende Issues sortiert, kleine Pull Requests geprüft und die Release-Vorbereitung mit reproduzierbaren Prüfschritten unterstützt.
      pt: Classifiquei incidências recebidas, revi pequenos pull requests e apoiei a preparação de versões com passos de verificação reproduzíveis.
      es: Clasifiqué incidencias entrantes, revisé pequeños pull requests y apoyé la preparación de versiones con pasos de comprobación reproducibles.
- titel: layout-sandbox
  projekt: cv-layout-sandbox
  zeitraum: '2021'
  punkte:
  - tags:
    - CSS
    - Print
    - A4-Layout
    text:
      de: Experimentelle Drucklayouts für Lebensläufe verglichen, darunter eng gesetzte Abschnitte, längere Ortsangaben und unterschiedlich breite Tag-Zeilen.
      pt: Comparei layouts de impressão experimentais para currículos, incluindo secções compactas, localizações extensas e linhas de etiquetas com larguras diferentes.
      es: Comparé diseños de impresión experimentales para currículums, incluidos secciones compactas, ubicaciones extensas y filas de etiquetas de distintos anchos.
  - tags:
    - Fixture-Daten
    - Varianten
    - Regressionstest
    - Visuelle Prüfung
    text:
      de: Beispielinhalte mit mehreren Einträgen, wechselnden Punktmengen und langen Begriffen gepflegt, um visuelle Abweichungen früh sichtbar zu machen.
      pt: Mantive conteúdo de exemplo com várias entradas, quantidades variáveis de pontos e termos longos para detetar cedo diferenças visuais.
      es: Mantuve contenido de ejemplo con varias entradas, cantidades variables de puntos y términos largos para detectar pronto diferencias visuales.
