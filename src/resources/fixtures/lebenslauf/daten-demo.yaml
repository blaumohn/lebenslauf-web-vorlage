berufserfahrung:
  - unternehmen: Tech Solutions GmbH
    stellen:
      - titel: Frontend Developer
        ort: Berlin-Friedrichshain, Remote DACH
        zeitraum: 2021 ‒ 2023
        punkte:
          - tags:
              - React
              - Tailwind
              - Design-System
            text: >-
              UI-Komponenten für ein Kundenportal entwickelt, Varianten für
              kompakte Listen, ausführliche Detailansichten und druckoptimierte
              Darstellungen gepflegt.
          - tags:
              - Agil
              - Scrum
              - Stakeholder-Kommunikation
            text:
              de: >-
                Tägliche Arbeit in einem cross-funktionalen Team mit Abstimmung
                zwischen Produkt, Entwicklung, Qualitätssicherung und Support.
              en: >-
                Daily work in a cross-functional team with coordination between
                product, development, quality assurance and support.
              es: >-
                Trabajo diario en un equipo multifuncional con coordinación entre
                producto, desarrollo, control de calidad y soporte.
          - tags:
              - Accessibility
              - Keyboard UX
              - Browser Testing
              - Release Notes
            text: >-
              Bedienkonzepte für Tastatur, Fokusführung und reduzierte
              Bewegungen geprüft und die Ergebnisse für Freigaben in kurzen
              Release-Notizen dokumentiert.

      - titel: Junior Frontend Developer
        ort: Potsdam-Babelsberg / Berlin-Mitte
        zeitraum: 2020 ‒ 2021
        punkte:
          - tags:
              - HTML
              - CSS
              - Responsive Layouts
            text: >-
              Unterstützung bei der Entwicklung von Benutzeroberflächen für
              verschiedene Projekte, inklusive längerer Inhaltsblöcke und
              variierender Abschnittslängen.
          - tags:
              - JavaScript
              - React
            text:
              de: Entwicklung von interaktiven UI-Komponenten.
              en: Developed interactive UI components.
              es: Desarrollé componentes de interfaz interactivos.
          - tags:
              - Formulare
              - Validierung
              - Fehlerzustände
            text:
              de: >-
                Formularstrecken mit Pflichtfeldern, optionalen Angaben und
                verständlichen Fehlermeldungen aufgebaut.
              en: >-
                Built form flows with required fields, optional information and
                understandable error messages.
              es: >-
                Creé flujos de formularios con campos obligatorios, datos
                opcionales y mensajes de error comprensibles.

  - unternehmen: WebTech Innovations
    stellen:
      - titel: Backend Developer
        ort: Hamburg-Altona, Hybrid
        zeitraum: 2019 ‒ 2020
        punkte:
          - tags:
              - Node.js
              - Express
              - API-Integration
            text: >-
              Entwicklung von RESTful APIs zur Integration mit Frontend-Systemen,
              inklusive Fehlerbehandlung, Protokollierung und abgestimmten
              Antwortformaten.
          - tags:
              - MongoDB
              - Docker
            text:
              de: >-
                Aufbau und Verwaltung von Datenbanken sowie Containerisierung der
                Anwendung für lokale Entwicklung, Testumgebungen und Demos.
              en: >-
                Built and managed databases and containerized the application for
                local development, test environments and demos.
              es: >-
                Creé y administré bases de datos y contenedoricé la aplicación para
                desarrollo local, entornos de prueba y demostraciones.
          - tags:
              - Monitoring
              - Log-Auswertung
              - Schnittstellenanalyse
            text: >-
              Wiederkehrende Schnittstellenfehler mit Log-Auswertung eingegrenzt
              und technische Ursachen so beschrieben, dass sie zwischen Backend,
              Frontend und Betrieb nachvollziehbar blieben.

  - station:
      de: Elternzeit & Weiterbildung
      en: Parental leave & continuing education
      es: Permiso parental y formación continua
    ort: Berlin
    zeitraum: 2018 ‒ 2019
    beschreibung:
      de: >-
        Familienzeit genutzt und fachliche Kenntnisse durch Selbststudium
        vertieft.
      en: >-
        Used family time and deepened professional knowledge through self-study.
      es: >-
        Dediqué tiempo a la familia y profundicé conocimientos profesionales
        mediante autoestudio.

  - unternehmen: Digital Services AG
    stellen:
      - titel: Werkstudent UI Engineering
        ort: Köln-Ehrenfeld, Düsseldorf Medienhafen
        zeitraum: 2017 ‒ 2018
        punkte:
          - tags:
              - Prototyping
              - Design Review
              - Nutzerfeedback
            text: >-
              Klickbare Prototypen für interne Werkzeuge erstellt und Rückmeldungen
              aus kurzen Review-Runden in umsetzbare UI-Anpassungen übersetzt.
          - tags:
              - Tabellen
              - Filter
              - Leere Zustände
              - Ladezustände
            text: >-
              Tabellenansichten mit Filtern, leeren Zuständen und Ladezuständen
              vorbereitet, damit auch unvollständige Testdaten in der Vorlage
              realistische Layout-Abweichungen zeigen.

  - unternehmen: Creative Web GmbH
    stellen:
      - titel: Praktikant Frontend Developer
        ort: München-Schwabing, Vor-Ort
        zeitraum: 2018 ‒ 2019
        punkte:
          - tags:
              - HTML
              - CSS
            text: Unterstützung im Design und der Implementierung von Weblayouts.
          - tags:
              - JavaScript
              - React
              - Komponentenvarianten
            text:
              de: >-
                Entwicklung von interaktiven Webkomponenten im Team, darunter
                Navigationszustände, kompakte Karten und wiederverwendbare
                Inhaltsmodule.
              en: >-
                Developed interactive web components within the team, including
                navigation states, compact cards and reusable content modules.
              es: >-
                Desarrollé componentes web interactivos dentro del equipo,
                incluidos estados de navegación, tarjetas compactas y módulos de
                contenido reutilizables.

  - unternehmen: Kulturverein Beispielstadt
    stellen:
      - titel: Freie Mitarbeit Webpflege
        ort: Leipzig-Plagwitz und remote
        zeitraum: 2016 ‒ 2017
        punkte:
          - tags:
              - CMS
            text: Kurze Inhaltsaktualisierungen für Veranstaltungsseiten umgesetzt.
          - tags:
              - Redaktion
              - Bildpflege
              - Termine
            text: >-
              Wiederkehrende redaktionelle Aktualisierungen vorbereitet, Bilder für
              unterschiedliche Seitenbereiche zugeschnitten und Terminlisten
              konsistent gehalten.
          - tags:
              - Ehrenamtliche Teams
              - Abstimmung
              - Übergabe
              - Checklisten
            text: >-
              Übergaben mit ehrenamtlichen Teams über kurze Checklisten
              strukturiert, damit Inhalte auch bei wechselnden Ansprechpersonen
              nachvollziehbar gepflegt werden konnten.

opensource:
  - titel: react-visualizer
    projekt: react-visualizer
    url: https://example.invalid/react-visualizer
    zeitraum: "2022"
    punkte:
      - tags:
          - Open Source
          - React
          - Komponentenbaum
        text: >-
          Ein Tool zur Visualisierung von React-Komponenten-Hierarchien mit
          Fokus auf nachvollziehbare Zustände, Filter und exportierbare
          Ansichten.
      - tags:
          - Open Source
          - Testing
          - Dokumentation
        text: >-
          Implementierung von Unit-Tests zur Sicherstellung der Funktionalität
          und Robustheit der Anwendung sowie Ergänzung kurzer
          Nutzungshinweise für neue Beitragende.
      - tags:
          - Issues
          - Review
          - Release-Vorbereitung
        text: >-
          Eingehende Issues sortiert, kleine Pull Requests geprüft und die
          Release-Vorbereitung mit reproduzierbaren Prüfschritten unterstützt.
  - titel: layout-sandbox
    projekt: cv-layout-sandbox
    zeitraum: "2021"
    punkte:
      - tags:
          - CSS
          - Print
          - A4-Layout
        text: >-
          Experimentelle Drucklayouts für Lebensläufe verglichen, darunter
          eng gesetzte Abschnitte, längere Ortsangaben und unterschiedlich
          breite Tag-Zeilen.
      - tags:
          - Fixture-Daten
          - Varianten
          - Regressionstest
          - Visuelle Prüfung
        text: >-
          Beispielinhalte mit mehreren Einträgen, wechselnden Punktmengen und
          langen Begriffen gepflegt, um visuelle Abweichungen früh sichtbar zu
          machen.

